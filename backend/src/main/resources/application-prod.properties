# ============================================================
# 운영(prod) 프로파일 — Docker Compose 배포용
# 비밀값은 커밋하지 않고 서버의 .env(환경변수)로 주입한다.
# 실행: SPRING_PROFILES_ACTIVE=prod
# ============================================================
spring.application.name=donation

# 공공데이터포털 API
public.api.key=${PUBLIC_API_KEY}
public.api.url=http://openapi.1365.go.kr/openapi/service/rest/ContributionGroupService/getCntrProgramList

# DB (compose 서비스명 mysql)
spring.datasource.url=jdbc:mysql://mysql:3306/donation?serverTimezone=UTC&useUnicode=true&characterEncoding=utf8
spring.datasource.username=donation
spring.datasource.password=${DB_PW}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

mybatis.mapper-locations=classpath:mapper/*.xml
mybatis.configuration.map-underscore-to-camel-case=true

spring.batch.jdbc.initialize-schema=always
spring.batch.job.enabled=false

# 토스페이먼츠 (테스트 모드)
toss.secret-key=${TOSS_SECRET_KEY}
toss.confirm-url=https://api.tosspayments.com/v1/payments/confirm
toss.cancel-url=https://api.tosspayments.com/v1/payments

jwt.secret=${JWT_SECRET}

# LLM API (OpenAI 호환)
spring.ai.openai.base-url=https://api.openai.com
spring.ai.openai.api-key=${LLM_API_KEY}
spring.ai.openai.chat.options.model=gpt-5.4-mini
spring.ai.openai.embedding.options.model=text-embedding-3-large

gemini.base-url=https://generativelanguage.googleapis.com
gemini.api-key=${GEMINI_API_KEY}
gemini.model=gemini-3.5-flash

# 카카오 OAuth
kakao.rest-api-key=${KAKAO_REST_KEY}

# Redis Stack (compose 서비스명 redis)
chatbot.redis.host=redis
chatbot.redis.port=6379

# Redis 캐시 (통계 대시보드 응답 캐싱) — 벡터 스토어와 동일 인스턴스 사용
spring.data.redis.host=redis
spring.data.redis.port=6379

# 메일 발송 (Gmail SMTP) — 회원가입 인증 / 비밀번호 재설정 코드
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
app.mail.from=${MAIL_USERNAME}

# 파일 업로드 (compose 볼륨 /data/uploads)
app.upload.dir=/data/uploads
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=20MB

